# Spustenie: cp .env.example .env  (doplň GOOGLE_CLIENT_ID)  →  docker compose up -d
name: opravovator

services:
  app:
    build: .
    image: opravovator:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://opravovator:${POSTGRES_PASSWORD:-opravovator}@db:5432/opravovator
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opravovator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opravovator}
      POSTGRES_DB: opravovator
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opravovator"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:   # PDF súbory, vypálené opravy, obrázky
  db-data:    # databáza (úlohy, anotácie, body, história)
