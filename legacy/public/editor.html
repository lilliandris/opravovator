<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opravovač</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="editor">
  <header class="top">
    <a class="brand" href="/" title="Späť na úlohy">Opravovač</a>
    <span class="taskname" id="taskName"></span>
    <span class="save-state" id="saveState"></span>
    <span class="spacer"></span>
    <button class="btn" id="prevBtn" title="Predchádzajúce riešenie (Alt+↑)">‹ Predch.</button>
    <button class="btn" id="nextBtn" title="Ďalšie riešenie (Alt+↓)">Ďalšie ›</button>
    <button class="btn" id="resultBtn" title="Otvorí uložené PDF s opravami">Výsledné PDF</button>
    <button class="btn" id="settingsBtn">Nastavenia úlohy</button>
    <a class="btn" id="downloadBtn">Stiahnuť zip</a>
  </header>

  <div class="toolbar" id="toolbar">
    <button class="tool on" data-tool="select" title="Výber a presun (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></svg></button>
    <button class="tool" data-tool="arrow" title="Šípka (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button class="tool" data-tool="line" title="Čiara (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button class="tool" data-tool="rect" title="Obdĺžnik (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="tool" data-tool="ellipse" title="Elipsa (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
    <button class="tool" data-tool="image" title="Obrázok / podpis (I)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg></button>
    <button class="tool" data-tool="stamp" title="Vložiť body do PDF (B)"><svg viewBox="0 0 24 24"><path d="M7 4h4a3 3 0 010 6H7zM7 10h5a3.5 3.5 0 010 7H7zM7 4v16"/></svg></button>
    <span class="sep"></span>
    <span class="lbl">Písmo</span>
    <select id="fontSel" title="Typ písma"></select>
    <input type="number" id="sizeIn" min="4" max="200" step="1" title="Veľkosť písma">
    <span class="sep"></span>
    <span class="lbl">Hrúbka</span>
    <input type="number" id="widthIn" min="0.5" max="20" step="0.5" title="Hrúbka čiary">
    <span class="sep"></span>
    <div class="swatches" id="swatches"></div>
    <input type="color" id="colorIn" title="Vlastná farba">
    <span class="sep"></span>
    <button class="tool" id="undoBtn" title="Späť (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-2"/></svg></button>
    <button class="tool" id="redoBtn" title="Znova (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h2"/></svg></button>
    <button class="tool" id="delBtn" title="Zmazať označené (Delete)"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
    <span class="sep"></span>
    <button class="tool" id="zoomOut" title="Oddialiť">−</button>
    <span class="zoomval" id="zoomVal">100%</span>
    <button class="tool" id="zoomIn" title="Priblížiť">+</button>
    <button class="tool" id="zoomFit" title="Na šírku"><svg viewBox="0 0 24 24"><path d="M4 12h16M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3"/></svg></button>
  </div>

  <div class="work">
    <aside class="side">
      <div class="search">
        <input class="input" id="search" placeholder="Hľadať v riešeniach">
        <div class="chips" id="chips"></div>
      </div>
      <div class="sols" id="sols"></div>
    </aside>

    <section class="viewer t-select" id="viewer">
      <div class="pages" id="pages"><div class="loading">Načítavam…</div></div>
    </section>

    <aside class="rubric" id="rubric">
      <div class="rb-head">
        <button class="tool" id="rbToggle" title="Skryť/zobraziť bodovanie">⇥</button>
        <h3>Bodovanie</h3>
      </div>
      <div class="rb-body">
        <div class="total"><span class="big none" id="totalPts">–</span><span class="of" id="ofPts"></span></div>
        <div class="manual"><span>Body ručne</span><input class="input" id="manualIn" type="number" step="0.5" placeholder="auto"></div>
        <ul class="items" id="items"></ul>
        <div class="rb-actions">
          <button class="btn" id="editRubric">Upraviť bodovanie</button>
          <button class="btn danger" id="clearGrade">Zrušiť hodnotenie</button>
        </div>
        <div class="rb-actions">
          <button class="btn primary" id="stampBtn">Vložiť body do PDF</button>
        </div>
        <p class="hint">Klávesy 1–9 prepínajú položky. Body sa ukladajú do body.txt po každej zmene.</p>
      </div>
    </aside>
  </div>
</div>

<dialog id="settings">
  <h3>Nastavenia úlohy</h3>
  <form id="settingsForm">
    <label class="field"><span>Názov úlohy</span><input class="input" name="name" required></label>
    <label class="field"><span>Maximum bodov (nepovinné)</span><input class="input" name="max_points" type="number" step="0.5" min="0"></label>
    <label class="field"><span id="commentLbl">Komentár – rovnaký pre všetky riešenia</span><textarea class="input" name="comment_text"></textarea></label>
    <div class="row"><button type="button" class="btn" onclick="settings.close()">Zrušiť</button><button class="btn primary">Uložiť</button></div>
  </form>
</dialog>

<script src="/vendor/pdfjs/pdf.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/shared.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
